[package]
name = "verdict-contract"
description = "NEAR contract that accepts an AI answer only after verifying, on-chain, the model's TDX attestation and its signature over the exact request and response."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "5.30.0", features = ["unstable"] }
borsh = { version = "1.5", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
hex = "0.4"
verdict-core = { path = "../../crates/verdict-core" }
# The exact source the locked `tee-verifier.testnet` contract was built from
# (see its `contract_source_metadata`), so the Borsh layout cannot drift.
tee-verifier-interface = { git = "https://github.com/near/mpc", rev = "dcd67e0d893798f3d262aa0350ae4770d908b7e8" }

[dev-dependencies]
near-sdk = { version = "5.30.0", features = ["unstable", "unit-testing"] }
k256 = { version = "0.13", features = ["ecdsa"] }
sha3 = "0.10"
