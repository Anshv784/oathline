[package]
name = "oathline-market"
description = "A prediction market resolved by a Oathline-verified model: YES, NO or INVALID, decided from written rules and on-chain evidence."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.0"

[dev-dependencies]
near-sdk = { version = "5.30.0", features = ["unit-testing"] }
