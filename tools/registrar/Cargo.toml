[package]
name = "oathline-registrar"
description = "Fetches a NEAR AI model attestation, verifies it locally exactly as the contract will, and writes the policy or register_model arguments."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
dcap-qvl = "0.7.0"
hex = "0.4"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
oathline-core = { path = "../../crates/oathline-core" }
